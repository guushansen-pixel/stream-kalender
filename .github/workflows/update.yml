name: Daten aktualisieren

on:
  schedule:
    # 05:00 und 15:00 UTC: morgens frische Wochenend-/Abendlisten, nachmittags die
    # kurzfristig ergaenzten Sender fuer die Abendspiele.
    - cron: '0 5,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pipeline
        run: node pipeline/build.mjs
      - name: Commit, falls sich etwas geaendert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/review.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Daten aktualisiert"
            git push
          fi
